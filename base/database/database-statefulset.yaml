apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: microservice
spec:
  serviceName: "database-service"
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      serviceAccountName: ecr-reader
      containers:
      - name: database-container
        image: <Account ID>.dkr.ecr.us-east-1.amazonaws.com/database-service:latest
        ports:
        - containerPort: 3306
          name: mysql-port
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: gp2-csi   
      resources:
        requests:
          storage: 10Gi
